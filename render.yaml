services:
  - type: web
    name: reel-brain
    runtime: docker
    # Paid (Starter) so it never sleeps: Meta disables webhooks that keep timing out.
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: ADMIN_IG_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_BASIC
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PLAY_RTDN_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ADMIN_TOKEN
        sync: false

