services:
  - type: web
    name: reel-brain
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: WEBHOOK_SECRET   # letters, digits, _ and - only (Telegram rule)
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: COBALT_URL
        sync: false

# Scaling out (paid; Render has no free background workers): set ROLE=web on the
