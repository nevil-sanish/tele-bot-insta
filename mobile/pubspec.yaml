name: reelbrain
description: "Reel Brain: turn Instagram reels into searchable notes you can ask questions about."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^11.2.0
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  path_provider: ^2.1.6
  receive_sharing_intent: ^1.9.0
  sqlite3: ^3.7.1
  url_launcher: ^6.3.3
  video_thumbnail: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/analysis_spec.json
