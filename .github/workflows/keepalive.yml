# Pings the bot so Render's free instance doesn't sleep (it sleeps after ~15 min
# without traffic, and the next message then waits 30-60 s for a cold start).
# Every 5 minutes leaves margin, since GitHub can delay scheduled runs.
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://reel-brain.onrender.com/health
